<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Companion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <main id="main-content">
            <!-- HOME -->
            <section id="page-home" class="page active">
                <div class="hero">
                    <h1>Voice Companion</h1>
                    <p>Your intelligent AI assistant.</p>
                </div>
                <div class="orb-container"><div class="orb"></div></div>
                <button class="btn-gold" onclick="navigateTo('page-live')">Start Live Conversation</button>
                <button class="btn-outline" onclick="navigateTo('page-chat')">Open Chat</button>
                <div class="quick-actions">
                    <div class="card">Talk with AI</div>
                    <div class="card">Ask a question</div>
                </div>
            </section>

            <!-- CHAT -->
            <section id="page-chat" class="page">
                <header><h2>Chat</h2></header>
                <div id="chat-area" class="chat-area">
                    <div class="message assistant">Hello! How can I help you today?</div>
                </div>
                <div class="chat-input-container">
                    <input type="text" placeholder="Message...">
                    <button class="send-btn">➤</button>
                </div>
            </section>

            <!-- LIVE -->
            <section id="page-live" class="page">
                <header><h2>Live Conversation</h2></header>
                <div class="live-container">
                    <div id="voice-orb" class="orb"></div>
                    <div id="status-label" class="status">Ready</div>
                </div>
                <div class="live-controls">
                    <button id="mic-btn" class="mic-btn">🎙️</button>
                </div>
            </section>

            <!-- ABOUT -->
            <section id="page-about" class="page">
                <h2>About</h2>
                <div class="card">
                    <h3>Voice Companion v1.0</h3>
                    <p>A premium, mobile-first AI assistant designed for seamless voice and text interaction.</p>
                </div>
            </section>

            <!-- SETTINGS -->
            <section id="page-settings" class="page">
                <h2>Settings</h2>
                <div class="settings-group">
                    <label>Speech Rate</label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="settings-group">
                    <label>Volume</label>
                    <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button onclick="navigateTo('page-home')">🏠<span>Home</span></button>
            <button onclick="navigateTo('page-chat')">💬<span>Chat</span></button>
            <button onclick="navigateTo('page-live')">🎙️<span>Live</span></button>
            <button onclick="navigateTo('page-about')">ℹ️<span>About</span></button>
            <button onclick="navigateTo('page-settings')">⚙️<span>Settings</span></button>
        </nav>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
